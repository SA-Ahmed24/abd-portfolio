services:
  - type: web
    name: abd-portfolio
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn portfolio.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DATABASE_URL
        fromDatabase:
          name: abd-portfolio-db
          property: connectionString

databases:
  - name: abd-portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio
